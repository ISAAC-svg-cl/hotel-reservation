<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base background (for maskable full bleed or rounded card) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
         <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner Badge Container -->
  <g transform="translate(40, 40)" filter="url(#dropShadow)">
    <rect width="432" height="432" rx="72" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.75" />
    
    <!-- Stylized "N" Monogram -->
    <path 
      d="M 120.96000000000001 311.03999999999996 V 120.96000000000001 L 311.03999999999996 311.03999999999996 V 120.96000000000001" 
      stroke="#ffffff" 
      stroke-width="38.016" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
    <!-- Gold Crown/Accent Dot -->
    <circle 
      cx="354.23999999999995" 
      cy="95.04" 
      r="25.919999999999998" 
      fill="url(#goldGrad)" 
      filter="url(#goldGlow)"
    />
  </g>
</svg>