<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base background (for maskable full bleed or rounded card) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Inner Badge Container -->
  <g transform="translate(80, 80)" filter="url(#dropShadow)">
    <rect width="352" height="352" rx="80" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.75" />
    
    <!-- Stylized "N" Monogram -->
    <path 
      d="M 98.56 253.44 V 98.56 L 253.44 253.44 V 98.56" 
      stroke="#ffffff" 
      stroke-width="30.976" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
    <!-- Gold Crown/Accent Dot -->
    <circle 
      cx="288.64" 
      cy="77.44" 
      r="21.119999999999997" 
      fill="url(#goldGrad)" 
      filter="url(#goldGlow)"
    />
  </g>
</svg>